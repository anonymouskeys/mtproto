name: Update MTProto proxies
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mtproto-publish
  cancel-in-progress: false
jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test collector
        run: python -m unittest discover -s tests -v
      - name: Collect proxy links
        env:
          PROXY_SOURCES: ${{ secrets.PROXY_SOURCES }}
        run: python scripts/collect.py
      - name: Commit changed list
        env:
          AUTHOR_NAME: ${{ vars.COMMIT_NAME }}
          AUTHOR_EMAIL: ${{ vars.COMMIT_EMAIL }}
        run: |
          git config user.name "${AUTHOR_NAME:-github-actions[bot]}"
          git config user.email "${AUTHOR_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
          git add -- proxies.txt
          if git diff --cached --quiet; then
            echo "List unchanged."
            exit 0
          fi
          git commit -m "Update MTProto proxy list"
          git push origin HEAD
